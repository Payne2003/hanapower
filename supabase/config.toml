# Cấu hình Supabase CLI cho phát triển cục bộ (Windows cần Docker Desktop).
#   npx supabase start      → chạy Postgres, Auth, REST, Realtime, Storage, Studio
#   npx supabase db reset   → áp dụng supabase/migrations + supabase/seed.sql
project_id = "hanapower"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Ứng dụng nội bộ: không cho tự đăng ký; quản trị viên tạo tài khoản.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = false

[analytics]
enabled = false
